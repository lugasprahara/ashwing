<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASHWING — a side-scrolling shmup</title>
<style>
  html, body { margin: 0; height: 100%; background: #04060d; }
  body { display: grid; place-items: center; overflow: hidden; }
  canvas {
    width: min(100vw, 177.78vh); height: min(56.25vw, 100vh);
    image-rendering: auto; display: block;
    box-shadow: 0 0 80px rgba(64, 120, 255, 0.18);
    background: #05070f;
    cursor: crosshair;
  }
</style>
</head>
<body>
<canvas id="game" width="960" height="540" aria-label="Ashwing game canvas"></canvas>
<script type="module" src="src/main.js"></script>
</body>
</html>
